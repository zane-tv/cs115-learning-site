name: Fix chatbot LaTeX renderer once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-chatbot-latex-once.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch chatbot LaTeX rendering
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('chatbot.js')
          s = p.read_text(encoding='utf-8')

          ensure = r'''function ensureKatex(){
  if(typeof window.renderMathInElement==='function')return Promise.resolve();
  if(katexPromise)return katexPromise;
  const addCss=()=>{
    if(document.querySelector('link[data-cs115-katex],link[href*="katex.min.css"]'))return;
    const l=document.createElement('link');
    l.rel='stylesheet';
    l.href='https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css';
    l.crossOrigin='anonymous';
    l.dataset.cs115Katex='1';
    document.head.append(l);
  };
  const loadScript=(src,ready)=>{
    if(ready())return Promise.resolve();
    return new Promise((resolve,reject)=>{
      let settled=false;
      const finish=()=>{if(!settled&&ready()){settled=true;resolve()}};
      const fail=()=>{if(!settled){settled=true;reject(new Error('Không tải được '+src))}};
      let node=[...document.scripts].find(x=>x.src===src);
      if(!node){
        node=document.createElement('script');
        node.src=src;
        node.defer=true;
        node.crossOrigin='anonymous';
        document.head.append(node);
      }
      node.addEventListener('load',finish,{once:true});
      node.addEventListener('error',fail,{once:true});
      queueMicrotask(finish);
      setTimeout(finish,0);
      setTimeout(()=>{if(!settled){if(ready())finish();else fail()}},8000);
    });
  };
  addCss();
  const core='https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js';
  const auto='https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js';
  katexPromise=loadScript(core,()=>!!window.katex&&typeof window.katex.render==='function')
    .then(()=>loadScript(auto,()=>typeof window.renderMathInElement==='function'))
    .catch(error=>{katexPromise=null;console.warn('Không tải được KaTeX',error);throw error});
  return katexPromise;
}'''

          s, n = re.subn(r"function ensureKatex\(\)\{.*?\n\}\nconst KEYS=", ensure + "\nconst KEYS=", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Không tìm thấy ensureKatex() để vá')

          inline = r'''function appendInline(parent,source){
  const token=/(\\\[[^\n]*?\\\]|\\\([^\n]*?\\\)|\$\$[^\n]*?\$\$|\$(?:\\.|[^$\\\n])+\$|`[^`\n]+`|\*\*[^*\n]+\*\*|~~[^~\n]+~~|\*[^*\n]+\*|\[[^\]\n]+\]\([^\s)]+\))/g;
  let last=0,m;
  while((m=token.exec(source))){
    if(m.index>last)parent.append(document.createTextNode(source.slice(last,m.index)));
    const t=m[0];
    const mathToken=t.startsWith('\\[')||t.startsWith('\\(')||t.startsWith('$$')||(t.startsWith('$')&&t.endsWith('$'));
    if(mathToken){parent.append(document.createTextNode(t))}
    else if(t.startsWith('`')){const e=document.createElement('code');e.textContent=t.slice(1,-1);parent.append(e)}
    else if(t.startsWith('**')){const e=document.createElement('strong');appendInline(e,t.slice(2,-2));parent.append(e)}
    else if(t.startsWith('~~')){const e=document.createElement('del');appendInline(e,t.slice(2,-2));parent.append(e)}
    else if(t.startsWith('*')){const e=document.createElement('em');appendInline(e,t.slice(1,-1));parent.append(e)}
    else{
      const lm=t.match(/^\[([^\]]+)\]\(([^)]+)\)$/);const href=lm?safeUrl(lm[2]):'';
      if(href){const a=document.createElement('a');a.href=href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=lm[1];parent.append(a)}else parent.append(document.createTextNode(t));
    }
    last=token.lastIndex;
  }
  if(last<source.length)parent.append(document.createTextNode(source.slice(last)));
}'''

          s, n = re.subn(r"function appendInline\(parent,source\)\{.*?\n\}\n\nfunction makeParagraph", inline + "\n\nfunction makeParagraph", s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Không tìm thấy appendInline() để vá')

          # Improve normalization for responses that contain doubled LaTeX command slashes,
          # while keeping intentional LaTeX line breaks (\\\\ followed by whitespace/&).
          old = "const body=b=>b.replaceAll('\\\\\\\\\\\\\\\\','\\\\\\\\').replaceAll('\\\\_','_').replace(/\\s*\\n\\s*/g,' ').trim();"
          new = "const body=b=>b.replace(/\\\\\\\\(?=[A-Za-z])/g,'\\\\').replaceAll('\\\\_','_').replace(/\\s*\\n\\s*/g,' ').trim();"
          if old in s:
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/fix-chatbot-latex-once.yml').unlink()
          PY
          node --check chatbot.js
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add chatbot.js .github/workflows/fix-chatbot-latex-once.yml
          git commit -m 'Fix LaTeX rendering in chatbot'
          git push
