name: Restore matrix deep-dive

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore matrix page from recovered source
        run: |
          set -euo pipefail
          test -f recovered-source/lessons/ma-tran-chuyen-sau.html
          mkdir -p lessons
          cp recovered-source/lessons/ma-tran-chuyen-sau.html lessons/ma-tran-chuyen-sau.html
      - name: Commit restored page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lessons/ma-tran-chuyen-sau.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore Matrix deep-dive page'
          git push
