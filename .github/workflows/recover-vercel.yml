name: Recover Vercel frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recover deployed frontend
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, re, urllib.request

          BASE = 'https://cs115-learning-site.vercel.app'
          ROOT = pathlib.Path('.')
          ua = {'User-Agent': 'cs115-source-recovery/1.0'}

          def fetch(path):
              req = urllib.request.Request(BASE + path, headers=ua)
              with urllib.request.urlopen(req, timeout=45) as r:
                  data = r.read()
                  final = r.geturl()
                  ctype = r.headers.get('content-type', '')
              return data, final, ctype

          index, final, ctype = fetch('/')
          text = index.decode('utf-8')
          if 'CS115 · Thư viện bài học' not in text or '/data/c00.txt' not in text:
              raise SystemExit(f'Production domain did not return the expected CS115 loader. Final URL: {final}')

          (ROOT / 'index.html').write_bytes(index)

          urls_m = re.search(r'const urls=\[(.*?)\];const lens=', text, re.S)
          lens_m = re.search(r'const lens=\[(.*?)\];const hs=', text, re.S)
          hashes_m = re.search(r'const hs=\[(.*?)\];const status=', text, re.S)
          digest_m = re.search(r"digest!==\'([0-9a-f]{64})\'", text)
          if not (urls_m and lens_m and hashes_m and digest_m):
              raise SystemExit('Could not parse loader metadata from production index.html')

          urls = json.loads('[' + urls_m.group(1) + ']')
          lens = json.loads('[' + lens_m.group(1) + ']')
          hashes = json.loads('[' + hashes_m.group(1) + ']')

          parts = []
          for i, path in enumerate(urls):
              data, final, ctype = fetch(path)
              t = data.decode('utf-8').strip()
              if len(t) != lens[i]:
                  raise SystemExit(f'{path}: length {len(t)} != {lens[i]}')
              h = hashlib.sha256(t.encode()).hexdigest()
              if h != hashes[i]:
                  raise SystemExit(f'{path}: SHA-256 mismatch')
              target = ROOT / path.lstrip('/')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(t + '\n', encoding='utf-8')
              parts.append(t)

          encoded = ''.join(parts).replace('-', '+').replace('_', '/')
          encoded += '=' * ((4 - len(encoded) % 4) % 4)
          raw = gzip.decompress(base64.b64decode(encoded))
          got = hashlib.sha256(raw).hexdigest()
          if got != digest_m.group(1):
              raise SystemExit(f'Pack SHA-256 mismatch: {got}')
          pack = json.loads(raw)

          recovered = ROOT / 'recovered-source'
          recovered.mkdir(exist_ok=True)
          (recovered / 'pack.json').write_text(json.dumps(pack, ensure_ascii=False, indent=2), encoding='utf-8')
          assets = recovered / 'assets'
          assets.mkdir(exist_ok=True)
          (assets / 'styles.css').write_text(pack.get('css', ''), encoding='utf-8')
          (assets / 'app.js').write_text(pack.get('js', ''), encoding='utf-8')

          pages = pack.get('pages', {})
          for route, html in pages.items():
              route = route or '/'
              if route == '/':
                  p = recovered / 'index.html'
              elif route.endswith('/'):
                  p = recovered / route.lstrip('/') / 'index.html'
              else:
                  rel = route.lstrip('/')
                  p = recovered / rel
                  if not p.suffix:
                      p = p / 'index.html'
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(html, encoding='utf-8')

          for asset in ('/chatbot.css', '/chatbot.js'):
              data, final, ctype = fetch(asset)
              (ROOT / asset.lstrip('/')).write_bytes(data)

          manifest = {
              'recovered_from': BASE,
              'pack_sha256': got,
              'routes': sorted(pages.keys()),
              'data_chunks': urls,
              'note': 'Frontend deployment output recovered from production. Serverless function source is not exposed by the public deployment.'
          }
          (ROOT / 'RECOVERY_MANIFEST.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit recovered files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data chatbot.css chatbot.js recovered-source RECOVERY_MANIFEST.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Recover frontend from Vercel production deployment'
          git push
