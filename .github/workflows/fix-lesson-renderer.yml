name: Fix lesson renderer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Support all callout block types
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lesson.html')
          s = p.read_text(encoding='utf-8')
          old = "if(b.type==='note')return `<div class=\"${b.style||'note'}\"><span class=\"box-title\">${b.title||'Ghi chú'}</span>${b.html}</div>`;"
          new = "if(['note','deep','warning','success'].includes(b.type))return `<div class=\"${b.style||b.type||'note'}\"><span class=\"box-title\">${b.title||'Ghi chú'}</span>${b.html}</div>`;"
          if old in s:
              s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')
          elif "['note','deep','warning','success'].includes(b.type)" not in s:
              raise SystemExit('Expected renderer line not found')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lesson.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Render all lesson callout types'
          git push
