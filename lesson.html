or:#526176;font-size:12px;font-weight:800}.section h3{margin:24px 0 9px;font-size:21px}.section p{margin:10px 0}.bullets{display:grid;gap:8px;padding:0;margin:12px 0;list-style:none}.bullets li{position:relative;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:11px;background:#f8fafc}.bullets li:before{content:"✓";position:absolute;left:12px;top:10px;color:#15803d;font-weight:900}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{padding:16px;border:1px solid var(--line);border-radius:14px;background:#f8fafc}.card h4{margin:0 0 7px}.blue{background:#eff6ff;border-color:#bfdbfe}.green{background:#f0fdf4;border-color:#bbf7d0}.amber{background:#fffbeb;border-color:#fde68a}.violet{background:#f5f3ff;border-color:#ddd6fe}.red{background:#fef2f2;border-color:#fecaca}.formula{padding:15px 16px;margin:13px 0;border-radius:12px;background:#102a56;color:#fff;text-align:center;font-size:20px;overflow:auto}.formula.light{background:#f1f5f9;color:#172033;border:1px solid var(--line)}.formula-note{text-align:center;color:var(--muted);font-size:14px;margin-top:-6px}.note,.warning,.success,.deep{margin:14px 0;padding:15px 17px;border-radius:13px;border-left:5px solid}.note{background:#eff6ff;border-color:#2563eb}.warning{background:#fffbeb;border-color:#d97706}.success{background:#f0fdf4;border-color:#16a34a}.deep{background:#f5f3ff;border-color:#7c3aed}.box-title{display:block;font-weight:900;margin-bottom:4px}.worked{border:1px solid #bfdbfe;border-radius:15px;overflow:hidden;margin:15px 0}.worked-title{padding:11px 14px;background:linear-gradient(90deg,#dbeafe,#ecfeff);font-weight:900;color:#153b75}.worked-body{padding:16px}.steps{display:grid;gap:9px}.step{position:relative;padding:11px 12px 11px 46px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.step:before{content:attr(data-step);position:absolute;left:12px;top:10px;display:grid;place-items:center;width:2 r-row{display:flex;gap:8px;flex-wrap:wrap}.answer-row input{flex:1;min-width:220px;padding:9px 10px;border:1px solid #cbd5e1;border-radius:9px}.feedback{display:none;margin-top:9px;padding:10px;border-radius:9px}.feedback.show{display:block}.feedback.good{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.feedback.bad{background:#fef2f2;border:1px solid #fecaca;color:#991b1b}.solution{display:none;margin-top:9px;padding:11px;border-radius:9px;background:#f8fafc;border:1px solid var(--line)}.solution.show{display:block}.glossary{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.glossary div{padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.footer{margin-top:24px;padding:20px;border-radius:15px;background:#102a56;color:#dbeafe}.footer a{color:#a5f3fc}.small{font-size:13px;color:var(--muted)}.loading{padding:80px 24px;text-align:center}.loading h1{color:#1d4ed8}.debug{max-width:900px;margin:16px auto;padding:12px;border-radius:10px;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;font:13px/1.5 ui-monospace,monospace;white-space:pre-wrap;overflow:auto}@media(max-width:900px){body{font-size:16px}.page{width:calc(100% - 14px)}.hero{padding:28px 18px}.hero-grid,.sourcebar,.layout,.grid2,.grid3,.lab-grid{grid-template-columns:1fr}.hero h1{font-size:36px}.sidebar{position:relative;top:0;max-height:none}.toc{display:flex;overflow:auto}.toc a{min-width:max-content}.section{padding:20px 14px}.glossary{grid-template-columns:1fr}.sitebar{align-items:flex-start}.answer-row{display:grid}.answer-row input{min-width:0}.btn{min-height:46px}}

<body>
<div class="reading" id="reading"></div>
<div id="app" class="loading"><h1>CS115</h1><p>Đang tải bài học từ bộ dữ liệu đã rà soát…</p></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escAttr=s=>esc(s).replace(/`/g,'&#96;');
const slug=(decodeURIComponent(location.pathname).split('/').pop()||'').replace(/\.html$/,'');
const dataUrl='/lesson-data/'+slug+'.json';
const app=document.getElementById('app');
const money=x=>Number.isFinite(x)?(+x.toFixed(6)).toString():'—';
function repairJsonBackslashes(raw){let out='',inside=false;for(let i=0;i<raw.length;i++){const c=raw[i];if(!inside){out+=c;if(c==='"')inside=true;continue}if(c==='"'){out+=c;inside=false;continue}if(c!=='\\'){out+=c;continue}const n=raw[i+1]||'',n2=raw[i+2]||'';if(n==='\\'||n==='"'||n==='/'){out+=c+n;i++;continue}if(n==='u'&&/^[0-9a-fA-F]{4}$/.test(raw.slice(i+2,i+6))){out+=raw.slice(i,i+6);i+=5;continue}if('bfnrt'.includes(n)&&!/[A-Za-z]/.test(n2)){out+=c+n;i++;continue}out+='\\\\'}return out}
function parseLessonJson(raw){try{return JSON.parse(raw)}catch(first){const repaired=repairJsonBackslashes(raw);try{return JSON.parse(repaired)}catch(second){second.message+=' · sau khi tự sửa backslash LaTeX';throw second}}}
function renderMath(root=document){root.querySelectorAll('[data-latex]').forEach(el=>{if(el.dataset.done)return;try{katex.render(el.dataset.latex,el,{displayMode:true,throwOnError:false,strict:'ignore'});el.dataset.done='1'}catch{}})}
function block(b){if(b.type==='p')return `<p>${b.html||''}</p>`;if(b.type==='bullets')return `<ul class="bullets">${(b.items||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`;if(b.type==='formula')return `<div class="formula ${b.light?'light':''}" data-latex="${escAttr(b.latex||'')}"></div>${b.note?`<div class="formula-note">${b.note}</div>`:''}`;if(['note','deep','warning','success'].includes(b.type))return `<div class="${b.style||b.type}"><span class="box-title">${b.title||'Ghi chú'}</span>${b.html||''}</div>`;if(b.type==='cards')return `<div class="grid${b.cols||2}">${(b.items||[]).map((x,i)=>`<div class="card ${x.style||['blue','green','amber','violet'][i%4]}"><h4>${x.title||''}</h4>${x.html||''}</div>`).join('')}</div>`;if(b.type==='example')return `<div class="worked"><div class="worked-title">${b.title||'Ví dụ'}</div><div class="worked-body">${b.intro?`<p>${b.intro}</p>`:''}<div class="steps">${(b.steps||[]).map((x,i)=>`<div class="step" data-step="${i+1}">${x}</div>`).join('')}</div>${b.result?`<div class="success"><span class="box-title">Kết quả</span>${b.result}</div>`:''}</div></div>`;if(b.type==='table')return `<div class="table-wrap"><table class="data"><thead><tr>${(b.headers||[]).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${(b.rows||[]).map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;return ''}
function labHtml(l){if(!l)return '';const common=`<section class="section" id="lab"><div class="head"><div class="badge">⚙</div><div><h2>${l.title||'Lab tương tác'}</h2><p class="sub">${l.subtitle||'Thử thay số để kiểm tra trực giác.'}</p></div></div><div class="lab" id="labbox">`;if(l.type==='split')return common+`<div class="lab-grid"><div class="field"><label>Tổng số mẫu N</label><input id="N" type="number" value="1000"></div><div class="field"><label>Train (%)</label><input id="tr" type="number" value="70"></div><div class="field"><label>Validation (%)</label><input id="va" type="number" value="15"></div></div><div class="buttons"><button class="btn primary" data-lab="split">Tính cách chia</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='linear2')return common+`<div class="lab-grid"><div class="field"><label>a11,a12;b1</label><input id="r1" value="2,1,5"></div><div class="field"><label>a21,a22;b2</label><input id="r2" value="1,-1,1"></div></div><div class="buttons"><button class="btn primary" data-lab="linear2">Giải hệ 2×2</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='vector')return common+`<div class="lab-grid"><div class="field"><label>u</label><input id="u" value="2,-1,3"></div><div class="field"><label>v</label><input id="v" value="-1,4,2"></div></div><div class="buttons"><button class="btn primary" data-lab="dot">u·v</button><button class="btn" data-lab="norm">||u||₂</button><button class="btn" data-lab="dist">d(u,v)</button><button class="btn" data-lab="cos">cos(u,v)</button><button class="btn" data-lab="proj">projᵥ(u)</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='gradient2')return common+`<p class="small">f(x,y)=ax²+bxy+cy²+dx+ey+k.</p><div class="lab-grid"><div class="field"><label>a,b,c,d,e,k</label><input id="coef" value="1,2,3,4,-2,0"></div><div class="field"><label>Điểm (x,y)</label><input id="pt" value="1,2"></div></div><div class="buttons"><button class="btn primary" data-lab="grad">Tính ∇f và H</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='prob')return common+`<div class="lab-grid"><div class="field"><label>n</label><input id="n" type="number" value="10"></div><div class="field"><label>p</label><input id="p" type="number" value="0.3" step="0.01"></div><div class="field"><label>k</label><input id="k" type="number" value="3"></div></div><div class="buttons"><button class="btn primary" data-lab="binom">Binomial P(X=k), E, Var</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='regression')return common+`<div class="lab-grid"><div class="field"><label>x</label><textarea id="xs">1,2,3,4,5</textarea></div><div class="field"><label>y</label><textarea id="ys">2,4,5,4,5</textarea></div></div><div class="buttons"><button class="btn primary" data-lab="reg">Fit y=b+wx</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='optimization')return common+`<p class="small">f(x)=ax²+bx+c; so sánh Gradient Descent và Newton.</p><div class="lab-grid"><div class="field"><label>a,b,c</label><input id="q" value="2,-8,3"></div><div class="field"><label>x₀</label><input id="x0" value="0"></div><div class="field"><label>learning rate η</label><input id="eta" value="0.1"></div><div class="field"><label>Số bước GD</label><input id="iters" type="number" value="8"></div></div><div class="buttons"><button class="btn primary" data-lab="gd">Chạy Gradient Descent</button><button class="btn" data-lab="newton">1 bước Newton</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='neural')return common+`<div class="lab-grid"><div class="field"><label>x</label><input id="nx" value="1,2,-1"></div><div class="field"><label>w</label><input id="nw" value="0.5,-1,2"></div><div class="field"><label>bias b</label><input id="nb" value="0.2"></div><div class="field"><label>Activation</label><select id="act"><option>relu</option><option>sigmoid</option><option>tanh</option></select></div></div><div class="buttons"><button class="btn primary" data-lab="neuron">Forward neuron</button></div><div class="result" id="labres"></div></div></section>`;if(l.type==='course')return common+`<div class="result"><b>Checklist học:</b><div id="coursecheck"></div></div></div></section>`;return ''}
function NEl(id){return document.getElementById(id)}
function bindLab(l){if(!l)return;const res=NEl('labres');const vec=id=>NEl(id).value.split(/[,;\s]+/).filter(Boolean).map(Number);document.querySelectorAll('[data-lab]').forEach(b=>b.onclick=()=>{const op=b.dataset.lab;try{if(op==='split'){const N=+NEl('N').value,tr=+NEl('tr').value,va=+NEl('va').value,te=100-tr-va;if(te<0)throw Error('train + validation phải ≤ 100%');res.innerHTML=`Train ≈ <b>${Math.round(N*tr/100)}</b>, validation ≈ <b>${Math.round(N*va/100)}</b>, test ≈ <b>${Math.round(N*te/100)}</b>.`}if(op==='linear2'){const A=vec('r1'),B=vec('r2');if(A.length!==3||B.length!==3)throw Error('Mỗi hàng cần 3 số.');const d=A[0]*B[1]-A[1]*B[0];res.innerHTML=Math.abs(d)<1e-12?'det(A)=0: hệ không có nghiệm duy nhất.':`det(A)=${money(d)}; x=${money((A[2]*B[1]-A[1]*B[2])/d)}, y=${money((A[0]*B[2]-A[2]*B[0])/d)}`}if(['dot','norm','dist','cos','proj'].includes(op)){const u=vec('u'),v=vec('v');if(!u.length||u.length!==v.length)throw Error('u và v phải cùng số chiều.');const dot=u.reduce((s,x,i)=>s+x*v[i],0),nu=Math.hypot(...u),nv=Math.hypot(...v);if(op==='dot')res.innerHTML=`u·v=<b>${money(dot)}</b>`;if(op==='norm')res.innerHTML=`||u||₂=<b>${money(nu)}</b>`;if(op==='dist')res.innerHTML=`d(u,v)=<b>${money(Math.hypot(...u.map((x,i)=>x-v[i])))}</b>`;if(op==='cos')res.innerHTML=!nu||!nv?'Không xác định với vector 0.':`cos(u,v)=<b>${money(dot/(nu*nv))}</b>`;if(op==='proj'){const vv=v.reduce((s,x)=>s+x*x,0);res.innerHTML=!vv?'Không chiếu lên vector 0.':`projᵥ(u)=<b>(${v.map(x=>money(x*dot/vv)).join(', ')})</b>`}}if(op==='grad'){const c=vec('coef'),p=vec('pt');if(c.length!==6||p.length!==2)throw Error('Cần 6 hệ số và điểm 2D.');const[a,b,c2,d,e]=c,[x,y]=p;res.innerHTML=`∇f(${x},${y})=<b>(${money(2*a*x+b*y+d)}, ${money(b*x+2*c2*y+e)})</b><br>H=<b>[[${money(2*a)}, ${money(b)}],[${money(b)}, ${money(2*c2)}]]</b>`}if(op==='binom'){const n=+NEl('n').value,p=+NEl('p').value,k=+NEl('k').value;if(!(n>=0&&k>=0&&k<=n&&p>=0&&p<=1))throw Error('Kiểm tra n,p,k.');let C=1;for(let i=1;i<=k;i++)C=C*(n-k+i)/i;res.innerHTML=`P(X=${k})=<b>${money(C*p**k*(1-p)**(n-k))}</b>; E=<b>${money(n*p)}</b>; Var=<b>${money(n*p*(1-p))}</b>`}if(op==='reg'){const x=vec('xs'),y=vec('ys');if(x.length<2||x.length!==y.length)throw Error('x,y phải cùng số phần tử.');const n=x.length,mx=x.reduce((a,b)=>a+b)/n,my=y.reduce((a,b)=>a+b)/n,den=x.reduce((s,a)=>s+(a-mx)**2,0);if(!den)throw Error('x không được đồng nhất.');const w=x.reduce((s,a,i)=>s+(a-mx)*(y[i]-my),0)/den,b0=my-w*mx,pred=x.map(a=>b0+w*a),mse=pred.reduce((s,a,i)=>s+(y[i]-a)**2,0)/n;res.innerHTML=`ŷ=<b>${money(b0)}+${money(w)}x</b><br>MSE=${money(mse)}`}if(op==='gd'||op==='newton'){const q=vec('q'),a=q[0],bb=q[1],cc=q[2],x0=+NEl('x0').value;if(q.length!==3||a===0)throw Error('Cần a,b,c với a≠0.');const g=x=>2*a*x+bb,f=x=>a*x*x+bb*x+cc;if(op==='newton'){const x=x0-g(x0)/(2*a);res.innerHTML=`x₁=<b>${money(x)}</b>, f(x₁)=${money(f(x))}`}else{let x=x0;const eta=+NEl('eta').value,it=+NEl('iters').value,h=[];for(let i=0;i<it;i++){h.push(`k=${i}: x=${money(x)}, f=${money(f(x))}`);x-=eta*g(x)}h.push(`k=${it}: x=${money(x)}, f=${money(f(x))}`);res.innerHTML=h.join('<br>')}}if(op==='neuron'){const x=vec('nx'),w=vec('nw'),b0=+NEl('nb').value;if(x.length!==w.length)throw Error('x,w phải cùng số chiều.');const z=x.reduce((s,a,i)=>s+a*w[i],b0),act=NEl('act').value;let y=z;if(act==='relu')y=Math.max(0,z);if(act==='sigmoid')y=1/(1+Math.exp(-z));if(act==='tanh')y=Math.tanh(z);res.innerHTML=`z=wᵀx+b=<b>${money(z)}</b>; ${act}(z)=<b>${money(y)}</b>`}}catch(e){res.innerHTML='<b style="color:#b91c1c">'+esc(e.message)+'</b>'}});if(l.type==='course'){const box=NEl('coursecheck');box.innerHTML=(l.items||[]).map((x,i)=>`<label style="display:block;padding:7px"><input type="checkbox" data-course="${i}"> ${x}</label>`).join('')}}
function renderExercises(d){const list=NEl('exercise-list'),key='cs115_full_'+d.slug+'_v2';let done={};try{done=JSON.parse(localStorage.getItem(key)||'{}')}catch{}const norm=s=>String(s).toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[−–—]/g,'-').replace(/\s+/g,'').replace(/[\[\]]/g,m=>m==='['?'(':')').replace(/;+/g,',');const score=()=>{const n=Object.values(done).filter(Boolean).length;NEl('score').textContent=n+'/'+d.exercises.length;NEl('scorebar').style.width=(n/d.exercises.length*100)+'%'};(d.exercises||[]).forEach((e,i)=>{const x=document.createElement('details');x.className='exercise';x.innerHTML=`<summary>Bài ${i+1} · ${e.q}</summary><div class="exercise-body"><div class="answer-row"><input aria-label="Đáp án bài ${i+1}" placeholder="Nhập đáp án ngắn"><button class="btn primary check">Chấm</button><button class="btn sol">Lời giải</button></div><div class="feedback"></div><div class="solution">${e.solution||''}${e.source?`<div class="small">Nguồn: ${e.source}</div>`:''}</div></div>`;const inp=x.querySelector('input'),fb=x.querySelector('.feedback'),sol=x.querySelector('.solution');x.querySelector('.check').onclick=()=>{const a=norm(inp.value),ok=(e.answers||[]).some(v=>norm(v)===a);fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'✓ Đúng.':'Chưa đúng. Xem lại định nghĩa/công thức và thử lại.';if(ok){done[i]=true;localStorage.setItem(key,JSON.stringify(done));score()}};x.querySelector('.sol').onclick=()=>sol.classList.toggle('show');list.append(x)});NEl('reset').onclick=()=>{done={};localStorage.removeItem(key);score()};score()}
async function main(){try{const r=await fetch(dataUrl,{cache:'no-store'});if(!r.ok)throw Error('Không tìm thấy dữ liệu bài học '+slug+' (HTTP '+r.status+')');const raw=await r.text();const d=parseLessonJson(raw);if(!d||!Array.isArray(d.sections))throw Error('Dữ liệu bài học không đúng schema.');document.title='CS115 · '+d.title;const toc=d.sections.map((s,i)=>`<a href="#${s.id}"><b>${i+1}</b>${s.title}</a>`).join('')+`<a href="#lab"><b>⚙</b>Lab tương tác</a><a href="#exercises"><b>✓</b>Bài tập</a><a href="#glossary"><b>A</b>Thuật ngữ</a>`;app.className='page';app.innerHTML=`<div class="sitebar"><div class="brand"><i>CS</i><span>CS115 · Toán cho Khoa học máy tính</span></div><a class="back" href="/">← Thư viện</a></div><header class="hero"><div class="hero-grid"><div><span class="eyebrow">${d.category||'CS115'} · source-audited</span><h1>${d.title}</h1><p>${d.subtitle||''}</p><div class="tags">${(d.tags||[]).map(x=>`<span class="tag">${x}</span>`).join('')}</div></div><div class="hero-card"><h2>Sau bài này bạn cần làm được</h2><ul>${(d.objectives||[]).map(x=>`<li>${x}</li>`).join('')}</ul></div></div></header><div class="sourcebar"><div class="source-card"><strong>Nguồn đã rà soát</strong><ul class="source-list">${(d.sources||[]).map(s=>`<li><b>${s.file}</b> · ${s.pages||''}${s.note?' · '+s.note:''}</li>`).join('')}</ul></div><div class="source-note"><b>Quy tắc biên soạn:</b> nội dung khái niệm và công thức bám theo PDF nguồn; ví dụ tự học dùng để luyện đúng các định nghĩa/công thức đó.</div></div><div class="layout"><aside class="sidebar"><strong>Mục lục</strong><nav class="toc">${toc}</nav></aside><main class="content">${d.sections.map((s,i)=>`<section class="section" id="${s.id}"><div class="head"><div class="badge">${i+1}</div><div><h2>${s.title}</h2><p class="sub">${s.lead||''}</p><span class="source-ref">${s.source||''}</span></div></div>${(s.blocks||[]).map(block).join('')}</section>`).join('')}${labHtml(d.lab)}<section class="section" id="exercises"><div class="head"><div class="badge">✓</div><div><h2>${(d.exercises||[]).length} bài tập tự chấm</h2><p class="sub">Làm trên giấy trước rồi nhập đáp án ngắn. Tiến độ lưu cục bộ trên trình duyệt.</p></div></div><div class="exercise-progress"><div class="exercise-progress-row"><b>Tiến độ</b><b id="score">0/${(d.exercises||[]).length}</b></div><div class="track"><span id="scorebar"></span></div><button class="btn" id="reset">Xóa tiến độ</button></div><div class="exercise-list" id="exercise-list"></div></section><section class="section" id="glossary"><div class="head"><div class="badge">A</div><div><h2>Thuật ngữ Anh–Việt</h2><p class="sub">Những từ nên nhận ra khi đọc slide và code.</p></div></div><div class="glossary">${(d.glossary||[]).map(x=>`<div><b>${x[0]}</b> — ${x[1]}</div>`).join('')}</div></section></main></div><footer class="footer"><b>Source coverage:</b> ${d.coverage||'Đã rà soát theo PDF nguồn.'} <a href="/SOURCE_AUDIT.md">Xem source audit</a> · <a href="/">← Về thư viện</a></footer>`;renderMath();renderExercises(d);bindLab(d.lab);const links=[...document.querySelectorAll('.toc a')],secs=links.map(a=>document.querySelector(a.getAttribute('href'))).filter(Boolean);const io=new IntersectionObserver(es=>es.filter(e=>e.isIntersecting).forEach(e=>links.forEach(a=>a.classList.toggle('active',a.getAttribute('href')==='#'+e.target.id))),{rootMargin:'-15% 0px -72% 0px'});secs.forEach(s=>io.observe(s))}catch(e){app.className='loading';app.innerHTML=`<h1>Không thể mở bài học</h1><p>${esc(e.message)}</p><p><a href="/">← Về thư viện</a></p><div class="debug">slug: ${esc(slug)}\ndata: ${esc(dataUrl)}</div>`}}
addEventListener('scroll',()=>{const d=document.documentElement,m=d.scrollHeight-d.clientHeight;NEl('reading').style.width=(m?d.scrollTop/m*100:0)+'%'},{passive:true});main();
